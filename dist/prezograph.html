<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'sha256-ny1UP6GxEKIAMNx4tZMXmtEzkU5soQ3EaqZ2C79c1AI='; script-src 'sha256-SFFcEknT6KzEeg9AL5izJjbXgYvj/CxIzfm3s5ktIkg='; img-src data:; connect-src 'none'; font-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Prezograph · Single-file deck</title>
  <style>:root {
  color-scheme: light;
  --pz-bg: #fcfbf7;
  --pz-surface: #ffffff;
  --pz-ink: #1d1f23;
  --pz-muted: #62666f;
  --pz-light: #6f747c;
  --pz-hair: #ddd8cb;
  --pz-indigo: #574ce3;
  --pz-green: #47751f;
  --pz-tan: #80551d;
  --pz-shadow: rgba(90, 80, 60, 0.1);
  --pz-card-delay: 120ms;
  --pz-card-fade: 550ms;
  --pz-card-move: 700ms;
  --pz-edge-fade: 700ms;
  --pz-node-fade: 700ms;
}

* {
  box-sizing: border-box;
}

html,
body,
#app,
.pz-shell {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
}

body {
  background: var(--pz-bg);
  color: var(--pz-ink);
  font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
}

button,
input,
textarea {
  font: inherit;
}

.pz-shell {
  position: relative;
  opacity: 0;
  transition: opacity 180ms ease;
}

.pz-shell.is-ready {
  opacity: 1;
}

.pz-viewport {
  position: fixed;
  inset: 0;
  overflow: hidden;
  cursor: grab;
  touch-action: none;
}

.pz-viewport.is-dragging {
  cursor: grabbing;
}

.pz-world {
  position: absolute;
  inset: 0 auto auto 0;
  width: 100px;
  height: 100px;
  transform-origin: 0 0;
}

.pz-edges {
  position: absolute;
  inset: 0 auto auto 0;
  overflow: visible;
  pointer-events: none;
}

.pz-edge {
  fill: none;
  stroke: var(--pz-hair);
  stroke-width: 1.6;
  opacity: 0.08;
  transition: opacity var(--pz-edge-fade) ease;
}

.pz-edge.is-on {
  opacity: 0.9;
}

.pz-edge.is-half {
  opacity: 0.3;
}

.pz-edge.is-hidden {
  opacity: 0;
}

.pz-edge-label {
  fill: var(--pz-light);
  stroke: var(--pz-bg);
  stroke-width: 4px;
  paint-order: stroke;
  text-anchor: middle;
  font: 12px ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  opacity: 0;
  transition: opacity var(--pz-edge-fade) ease;
}

.pz-edge-label.is-on {
  opacity: 1;
}

.pz-edge-label.is-hidden {
  opacity: 0;
}

.pz-tour {
  opacity: 0;
  pointer-events: none;
  transition: opacity 500ms ease;
}

.pz-tour.is-visible {
  opacity: 0.85;
}

.pz-tour-window {
  fill: none;
  stroke: var(--pz-indigo);
}

.pz-tour-number {
  fill: var(--pz-indigo);
  stroke: var(--pz-bg);
  paint-order: stroke;
  font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  font-weight: 750;
  letter-spacing: 0.02em;
}

.pz-node {
  position: absolute;
  display: block;
  width: 180px;
  min-height: 42px;
  margin: 0;
  padding: 10px 14px 11px;
  border: 1.5px solid var(--pz-hair);
  border-radius: 12px;
  background: var(--pz-surface);
  color: var(--pz-ink);
  box-shadow: 0 1px 4px var(--pz-shadow);
  text-align: left;
  cursor: pointer;
  opacity: 0.55;
  user-select: none;
  will-change: transform;
  transition: opacity var(--pz-node-fade) ease, border-color 180ms ease, box-shadow 180ms ease;
}

.pz-node:hover,
.pz-node:focus-visible {
  outline: none;
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--pz-indigo) 25%, transparent);
}

.pz-node.is-active {
  opacity: 1;
}

.pz-node.is-shown {
  opacity: 0.55;
}

.pz-node.is-context {
  opacity: 0.55;
}

.pz-node.is-beat-hidden,
.pz-node.is-revealing {
  opacity: 0;
  pointer-events: none;
}

.pz-node-title {
  font-size: 15px;
  font-weight: 750;
  line-height: 1.22;
  letter-spacing: -0.01em;
}

.pz-node-sub {
  margin-top: 3px;
  color: var(--pz-muted);
  font-size: 11px;
  line-height: 1.35;
}

.pz-node-body {
  margin-top: 5px;
  color: var(--pz-light);
  font: 10px/1.5 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}

.pz-node.kind-indigo {
  border-color: var(--pz-indigo);
}

.pz-node.kind-indigo .pz-node-title {
  color: var(--pz-indigo);
}

.pz-node.kind-green {
  border-color: var(--pz-green);
}

.pz-node.kind-green .pz-node-title {
  color: var(--pz-green);
}

.pz-node.kind-tan {
  border-color: var(--pz-tan);
}

.pz-node.kind-tan .pz-node-title {
  color: var(--pz-tan);
}

.pz-node.kind-ink {
  border-color: var(--pz-hair);
}

.pz-node.kind-hub {
  width: 220px;
  padding: 14px 18px;
}

.pz-node.kind-hub .pz-node-title {
  font-size: 19px;
}

.pz-node.kind-mega {
  width: 300px;
  padding: 18px 24px;
  border-radius: 16px;
}

.pz-node.kind-mega .pz-node-title {
  font-size: 30px;
}

.pz-node.kind-tiny {
  width: auto;
  min-width: 82px;
  min-height: 0;
  padding: 7px 11px;
  border-radius: 999px;
  text-align: center;
}

.pz-node.kind-tiny .pz-node-title {
  font-size: 12px;
}

.pz-node.kind-company .pz-node-sub,
.pz-node.kind-company .pz-node-body {
  display: none;
}

.pz-node.kind-ghost {
  border-color: transparent;
  background: transparent;
  box-shadow: none;
  text-align: center;
}

.pz-node.kind-ring {
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: color-mix(in srgb, var(--pz-surface) 86%, transparent);
  text-align: center;
}

.pz-node.kind-ring .pz-node-title {
  font-size: 16px;
}

.pz-node.kind-img {
  width: 240px;
}

.pz-mini-network {
  position: relative;
  height: 96px;
  margin-top: 7px;
}

.pz-mini-network svg {
  width: 100%;
  height: 100%;
}

.pz-mini-network line {
  stroke: #9cb982;
  stroke-width: 2;
}

.pz-mini-network circle {
  fill: #6f9d46;
}

.pz-mini-network text {
  fill: var(--pz-muted);
  font: 8px ui-monospace, monospace;
}

.pz-mini-table {
  display: grid;
  grid-template-columns: 1fr 1.3fr;
  gap: 7px;
  margin-top: 7px;
}

.pz-mini-table section {
  white-space: pre-line;
  padding: 5px 7px;
  border: 1px solid var(--pz-hair);
  border-radius: 6px;
  font: 8.5px/1.5 ui-monospace, monospace;
}

.pz-mini-table b {
  display: block;
  margin-bottom: 2px;
  color: var(--pz-light);
  font-weight: 500;
}

.pz-json-visual {
  margin-top: 8px;
  padding: 9px;
  border: 1px solid var(--pz-hair);
  border-radius: 8px;
  background: #f7f5ef;
  color: #3f4350;
  font: 9px/1.5 ui-monospace, monospace;
  white-space: pre;
}

.pz-card {
  position: absolute;
  width: 380px;
  padding: 16px 20px;
  border: 1.5px solid var(--pz-hair);
  border-radius: 16px;
  background: var(--pz-surface);
  box-shadow: 0 2px 8px var(--pz-shadow);
  opacity: 0;
  pointer-events: none;
  transition:
    opacity var(--pz-card-fade) ease var(--pz-card-delay),
    left var(--pz-card-move) ease,
    top var(--pz-card-move) ease;
}

.pz-card.is-in {
  opacity: 1;
}

.pz-card-title {
  font-size: 21px;
  font-weight: 760;
  line-height: 1.2;
  letter-spacing: -0.01em;
}

.pz-card-caption {
  margin-top: 6px;
  color: var(--pz-muted);
  font-size: 12.5px;
  font-style: italic;
  line-height: 1.45;
}

.pz-overlay-shade {
  position: fixed;
  inset: 0;
  z-index: 7;
  background: var(--pz-bg);
  pointer-events: none;
  transition: opacity 500ms ease;
}

.pz-overlay-shade[hidden],
.pz-overlay[hidden] {
  display: none;
}

.pz-overlay {
  position: fixed;
  top: 50%;
  left: 50%;
  z-index: 8;
  display: grid;
  width: min(880px, calc(100vw - 64px));
  aspect-ratio: 16 / 9;
  align-content: center;
  padding: clamp(34px, 5.5vw, 72px);
  overflow: hidden;
  border: 1.5px solid color-mix(in srgb, var(--pz-indigo) 42%, var(--pz-hair));
  border-radius: clamp(18px, 2.2vw, 28px);
  background: color-mix(in srgb, var(--pz-surface) 96%, transparent);
  box-shadow:
    0 30px 100px rgba(29, 31, 35, 0.18),
    0 2px 10px var(--pz-shadow);
  transform: translate(-50%, -50%);
  text-align: center;
  pointer-events: none;
  animation: pz-overlay-enter 720ms cubic-bezier(0.22, 1, 0.36, 1) both;
}

.pz-overlay::after {
  position: absolute;
  inset: 10px;
  border: 1px solid color-mix(in srgb, var(--pz-indigo) 12%, transparent);
  border-radius: calc(clamp(18px, 2.2vw, 28px) - 7px);
  content: "";
  pointer-events: none;
}

.pz-overlay-rule {
  width: clamp(52px, 7vw, 88px);
  height: 3px;
  margin: 0 auto clamp(18px, 3vw, 30px);
  border-radius: 999px;
  background: var(--pz-indigo);
}

.pz-overlay-title {
  max-width: 100%;
  margin: 0;
  font: 800 clamp(28px, 4.4vw, 58px)/1.08 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  letter-spacing: -0.055em;
  overflow-wrap: anywhere;
}

.pz-overlay-caption {
  margin: clamp(14px, 2.2vw, 24px) 0 0;
  color: var(--pz-muted);
  font-size: clamp(14px, 1.55vw, 20px);
  font-style: italic;
  line-height: 1.45;
}

.pz-shell.is-tour-complete .pz-overlay {
  box-shadow:
    0 32px 110px rgba(29, 31, 35, 0.2),
    0 0 0 4px color-mix(in srgb, var(--pz-indigo) 8%, transparent);
}

.pz-shell.is-overlay-blocking .pz-viewport {
  cursor: default;
  pointer-events: none;
}

@keyframes pz-overlay-enter {
  from {
    opacity: 0;
    transform: translate(-50%, calc(-50% + 20px)) scale(0.975);
  }
  to {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }
}

.pz-brand {
  position: fixed;
  top: 18px;
  left: 22px;
  z-index: 10;
  color: var(--pz-light);
  font-size: 12px;
  letter-spacing: 0.02em;
  pointer-events: none;
}

.pz-brand strong {
  color: var(--pz-ink);
}

.pz-legend {
  position: fixed;
  top: 42px;
  left: 22px;
  z-index: 10;
  display: flex;
  gap: 12px;
  padding: 6px 10px;
  border: 1px solid var(--pz-hair);
  border-radius: 9px;
  background: var(--pz-surface);
  color: var(--pz-muted);
  font: 10px ui-monospace, monospace;
  pointer-events: none;
}

.pz-legend span::before {
  display: inline-block;
  width: 8px;
  height: 8px;
  margin-right: 5px;
  border-radius: 50%;
  background: var(--dot);
  content: "";
}

.pz-hint {
  position: fixed;
  top: 18px;
  right: 22px;
  z-index: 10;
  color: var(--pz-muted);
  font: 11px/1.6 ui-monospace, monospace;
  text-align: right;
  pointer-events: none;
}

.pz-progress {
  position: fixed;
  bottom: 20px;
  left: 22px;
  z-index: 10;
  color: var(--pz-light);
  font: 11px ui-monospace, monospace;
  pointer-events: none;
}

.pz-nav {
  position: fixed;
  right: 22px;
  bottom: 20px;
  z-index: 12;
  display: flex;
  align-items: center;
  gap: 8px;
}

.pz-control {
  min-width: 42px;
  height: 42px;
  padding: 0 13px;
  border: 1.5px solid var(--pz-hair);
  border-radius: 999px;
  background: var(--pz-surface);
  color: var(--pz-ink);
  cursor: pointer;
}

.pz-control:hover,
.pz-control:focus-visible,
.pz-control[aria-pressed="true"] {
  border-color: var(--pz-indigo);
  color: var(--pz-indigo);
  outline: none;
}

.pz-control:disabled {
  cursor: default;
  opacity: 0.42;
}

.pz-control.is-icon {
  width: 42px;
  padding: 0;
  font-size: 18px;
}

.pz-dots {
  position: fixed;
  right: 26px;
  bottom: 74px;
  z-index: 12;
  display: flex;
  gap: 5px;
}

.pz-dot {
  width: 8px;
  height: 8px;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: var(--pz-hair);
  cursor: pointer;
  transition: background 300ms ease;
}

.pz-dot[aria-current="step"] {
  background: var(--pz-indigo);
}

.pz-overflow {
  position: fixed;
  left: 50%;
  bottom: 88px;
  z-index: 12;
  display: none;
  translate: -50% 0;
  padding: 7px 12px;
  border-radius: 999px;
  background: var(--pz-ink);
  color: white;
  font-size: 11px;
}

.pz-overflow.is-visible {
  display: block;
}

.pz-tip {
  position: fixed;
  z-index: 30;
  width: min(310px, calc(100vw - 20px));
  padding: 12px 14px;
  border-radius: 10px;
  background: var(--pz-ink);
  color: #f7f5ef;
  box-shadow: 0 7px 30px rgba(0, 0, 0, 0.2);
  font-size: 12px;
  line-height: 1.5;
  opacity: 0;
  transition: opacity 180ms ease;
}

.pz-tip.is-visible {
  opacity: 0.96;
}

.pz-tip[hidden] {
  display: none;
}

.pz-tip a {
  color: #c6c1ff;
}

.pz-tip-close {
  float: right;
  margin: -4px -5px 3px 8px;
  border: 0;
  background: transparent;
  color: white;
  cursor: pointer;
}

.pz-deck-picker {
  position: fixed;
  inset: 0;
  z-index: 40;
  display: grid;
  place-items: center;
  padding: 20px;
  background: rgba(29, 31, 35, 0.5);
}

.pz-deck-picker[hidden] {
  display: none;
}

.pz-deck-picker-box {
  width: min(460px, calc(100vw - 28px));
  padding: 22px;
  border: 1px solid var(--pz-hair);
  border-radius: 14px;
  background: var(--pz-surface);
  box-shadow: 0 20px 80px rgba(29, 31, 35, 0.24);
}

.pz-deck-picker h2 {
  margin: 0 0 8px;
  font-size: 20px;
}

.pz-deck-picker p {
  margin: 0 0 18px;
  color: var(--pz-muted);
  font-size: 13px;
  line-height: 1.5;
}

.pz-deck-picker label {
  display: grid;
  gap: 7px;
  color: var(--pz-muted);
  font-size: 12px;
}

.pz-deck-picker select,
.pz-deck-actions button {
  min-height: 42px;
  padding: 8px 11px;
  border: 1px solid var(--pz-hair);
  border-radius: 8px;
  background: var(--pz-surface);
  color: var(--pz-ink);
}

.pz-deck-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 14px;
}

.pz-deck-actions button {
  cursor: pointer;
}

.pz-deck-actions button:first-child {
  border-color: var(--pz-indigo);
  background: var(--pz-indigo);
  color: white;
}

.pz-deck-error {
  max-height: min(180px, 25vh);
  min-height: 1.4em;
  margin: 12px 0 0;
  overflow: auto;
  color: #a12d27;
  font: 11px/1.4 ui-monospace, monospace;
  white-space: pre-wrap;
}

.pz-toast {
  position: fixed;
  top: 74px;
  right: 22px;
  z-index: 50;
  padding: 8px 14px;
  border-radius: 999px;
  background: var(--pz-ink);
  color: white;
  opacity: 0;
  transition: opacity 180ms ease;
  pointer-events: none;
  font: 11px ui-monospace, monospace;
}

.pz-toast.is-visible {
  opacity: 1;
}

.pz-sr-only {
  position: absolute !important;
  width: 1px !important;
  height: 1px !important;
  padding: 0 !important;
  margin: -1px !important;
  overflow: hidden !important;
  clip: rect(0, 0, 0, 0) !important;
  white-space: nowrap !important;
  border: 0 !important;
}

.pz-fatal {
  height: 100%;
  padding: 40px;
  overflow: auto;
  background: #fff5f3;
}

.pz-fatal h1 {
  font-size: 22px;
}

.pz-fatal pre {
  padding: 16px;
  overflow: auto;
  border: 1px solid #d9aaa4;
  border-radius: 8px;
  background: white;
  white-space: pre-wrap;
}

@media (max-width: 700px) {
  .pz-brand {
    top: 14px;
    left: 14px;
    max-width: calc(100vw - 28px);
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }

  .pz-legend {
    top: 38px;
    left: 14px;
    gap: 8px;
    max-width: calc(100vw - 28px);
    overflow: hidden;
  }

  .pz-hint,
  .pz-dots {
    display: none;
  }

  .pz-progress {
    bottom: 84px;
    left: 16px;
  }

  .pz-nav {
    right: 14px;
    bottom: 16px;
    left: 14px;
    justify-content: flex-end;
  }

  .pz-control {
    height: 40px;
    padding: 0 10px;
  }

  .pz-control.is-icon {
    width: 40px;
    min-width: 40px;
  }

  .pz-nav .optional {
    display: none;
  }

  .pz-card {
    width: min(300px, calc(100vw - 28px));
  }

  .pz-overlay {
    width: calc(100vw - 28px);
    padding: 24px 22px;
    border-radius: 18px;
  }

  .pz-overlay-title {
    font-size: clamp(21px, 6.4vw, 30px);
    letter-spacing: -0.05em;
  }

  .pz-overlay-caption {
    margin-top: 12px;
    font-size: 13px;
  }

  .pz-overlay-rule {
    margin-bottom: 15px;
  }

  .pz-deck-picker {
    align-items: end;
    padding: 14px;
  }

  .pz-deck-picker-box {
    width: 100%;
    padding: 18px;
    border-radius: 16px;
  }

  .pz-deck-actions {
    display: grid;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    transition-duration: 0.001ms !important;
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
  }
}
</style>
</head>
<body>
  <main id="app" aria-live="polite"></main>
  <script>"use strict";

globalThis.PREZOGRAPH_DECK = {

  "entities": {

  return value !== null && typeof value === "object" && !Array.isArray(value);
}

  return Array.isArray(value) && value.length === 2 && value.every(Number.isFinite);

function add(issues, path, message) {
  issues.push({ path, message });
}

function checkId(issues, value, path) {
  if (typeof value !== "string" || !ID_RE.test(value)) {
    add(issues, path, "must be an identifier beginning with a letter");
    return false;

  return true;
}

  const seen = new Set();
  value.forEach((id, index) => {
    if (typeof id !== "string" || !allowed.has(id)) add(issues, `${path}[${index}]`, `unknown instance "${id}"`);
    if (seen.has(id)) add(issues, `${path}[${index}]`, `duplicates "${id}"`);
    seen.add(id);
  });
}

function validateDeck(deck, options = {}) {
  const issues = [];
  const maxNodes = options.maxNodes ?? 5000;
  const maxEdges = options.maxEdges ?? 12000;

  if (!isObject(deck)) return { valid: false, issues: [{ path: "$", message: "must be an object" }] };

  if (deck.schemaVersion !== SCHEMA_VERSION) {
    add(issues, "schemaVersion", `must equal "${SCHEMA_VERSION}"`);
  }
  if (!isObject(deck.meta)) add(issues, "meta", "must be an object");
  if (!isObject(deck.meta) || typeof deck.meta.title !== "string" || !deck.meta.title.trim()) {
    add(issues, "meta.title", "must be a non-empty string");
  }
  if (deck.meta?.repository && !/^https?:\/\//.test(deck.meta.repository)) {
    add(issues, "meta.repository", "must be an http(s) URL");
  }

  if (!isObject(deck.entities)) add(issues, "entities", "must be an object keyed by entity ID");
  const entityIds = new Set();
  if (isObject(deck.entities)) {
    for (const [id, entity] of Object.entries(deck.entities)) {
      checkId(issues, id, `entities.${id}`);
      if (entityIds.has(id)) add(issues, `entities.${id}`, "duplicate entity ID");
      entityIds.add(id);
      if (!isObject(entity)) {
        add(issues, `entities.${id}`, "must be an object");
        continue;
      }
      if (typeof entity.title !== "string" || !entity.title.trim()) add(issues, `entities.${id}.title`, "must be a non-empty string");
      for (const key of Object.keys(entity)) {
        if (!ENTITY_KEYS.has(key)) add(issues, `entities.${id}.${key}`, "is not an allowed entity property");
      }
      for (const key of ["sub", "body", "tip", "sourceDate"]) {
        if (entity[key] != null && typeof entity[key] !== "string") add(issues, `entities.${id}.${key}`, "must be a string");
      }
      if (entity.source && !/^https?:\/\//.test(entity.source)) add(issues, `entities.${id}.source`, "must be an http(s) URL");
      if (entity.sourceDate && !DATE_RE.test(entity.sourceDate)) add(issues, `entities.${id}.sourceDate`, "must be YYYY-MM-DD");
    }
  }

  if (!Array.isArray(deck.scenes) || deck.scenes.length === 0) add(issues, "scenes", "must be a non-empty array");
  const sceneIds = new Set();
  const instanceIds = new Set();
  const sceneInstanceIds = new Map();
  let nodeCount = 0;

  if (Array.isArray(deck.scenes)) {
    deck.scenes.forEach((scene, sceneIndex) => {
      const path = `scenes[${sceneIndex}]`;
      if (!isObject(scene)) {
        add(issues, path, "must be an object");
        return;
      }
      for (const key of Object.keys(scene)) {
        if (!SCENE_KEYS.has(key)) add(issues, `${path}.${key}`, "is not an allowed scene property");
      }
      if (checkId(issues, scene.id, `${path}.id`)) {
        if (sceneIds.has(scene.id)) add(issues, `${path}.id`, `duplicates scene "${scene.id}"`);
        sceneIds.add(scene.id);
      }
      if (typeof scene.title !== "string" || !scene.title.trim()) add(issues, `${path}.title`, "must be a non-empty string");
      if (scene.caption != null && typeof scene.caption !== "string") add(issues, `${path}.caption`, "must be a string");
      if (!isPair(scene.anchor)) add(issues, `${path}.anchor`, "must be [x, y] finite numbers");
      if (!Array.isArray(scene.instances) || scene.instances.length === 0) add(issues, `${path}.instances`, "must be a non-empty array");
      const local = new Set();
      sceneInstanceIds.set(scene.id, local);

      if (Array.isArray(scene.instances)) {
        nodeCount += scene.instances.length;
        scene.instances.forEach((instance, instanceIndex) => {
          const instancePath = `${path}.instances[${instanceIndex}]`;
          if (!isObject(instance)) {
            add(issues, instancePath, "must be an object");
            return;
          }
          if (checkId(issues, instance.id, `${instancePath}.id`)) {
            if (instanceIds.has(instance.id)) add(issues, `${instancePath}.id`, `duplicates global instance "${instance.id}"`);
            instanceIds.add(instance.id);
            local.add(instance.id);
          }
          for (const key of Object.keys(instance)) {
            if (!INSTANCE_KEYS.has(key)) add(issues, `${instancePath}.${key}`, "is not an allowed instance property");
          }
          if (!entityIds.has(instance.entity)) add(issues, `${instancePath}.entity`, `unknown entity "${instance.entity}"`);
          if (!isPair(instance.pos)) add(issues, `${instancePath}.pos`, "must be [x, y] finite numbers");
          if (instance.kind != null && (typeof instance.kind !== "string" || !KIND_RE.test(instance.kind))) {
            add(issues, `${instancePath}.kind`, "must contain lowercase space-separated style tokens");
          }
          if (instance.w != null && (!Number.isFinite(instance.w) || instance.w < 40 || instance.w > 1200)) {
            add(issues, `${instancePath}.w`, "must be between 40 and 1200");
          }
          if (instance.r != null && (!Number.isFinite(instance.r) || instance.r < 20 || instance.r > 800)) {
            add(issues, `${instancePath}.r`, "must be between 20 and 800");
          }
          if (instance.visual != null && !BUILTIN_VISUALS.has(instance.visual)) {
            add(issues, `${instancePath}.visual`, `must be one of ${[...BUILTIN_VISUALS].join(", ")}`);
          }
        });
      }

      if (scene.layout != null && !isObject(scene.layout)) add(issues, `${path}.layout`, "must be an object");
      if (isObject(scene.layout)) {
        for (const key of Object.keys(scene.layout)) {
          if (!LAYOUT_KEYS.has(key)) add(issues, `${path}.layout.${key}`, "is not an allowed layout property");
        }
      }
      for (const key of ["fitMargin", "pushMargin", "zoomMax", "floatAmp", "minReadableScale"]) {
        if (scene.layout?.[key] != null && (!Number.isFinite(scene.layout[key]) || scene.layout[key] < 0)) {
          add(issues, `${path}.layout.${key}`, "must be a non-negative finite number");
        }
      }
      if (scene.layout?.noCard != null && typeof scene.layout.noCard !== "boolean") add(issues, `${path}.layout.noCard`, "must be a boolean");

      if (scene.overlay != null && !isObject(scene.overlay)) add(issues, `${path}.overlay`, "must be an object");
      if (isObject(scene.overlay)) {
        for (const key of Object.keys(scene.overlay)) {
          if (!OVERLAY_KEYS.has(key)) add(issues, `${path}.overlay.${key}`, "is not an allowed overlay property");
        }
        if (scene.overlay.position != null && scene.overlay.position !== "center") {
          add(issues, `${path}.overlay.position`, 'must equal "center"');
        }
        if (scene.overlay.shape != null && scene.overlay.shape !== "slide") {
          add(issues, `${path}.overlay.shape`, 'must equal "slide"');
        }
        if (scene.overlay.aspectRatio != null && scene.overlay.aspectRatio !== "16:9") {
          add(issues, `${path}.overlay.aspectRatio`, 'must equal "16:9"');
        }
        for (const key of ["title", "caption"]) {
          if (scene.overlay[key] != null && typeof scene.overlay[key] !== "string") {
            add(issues, `${path}.overlay.${key}`, "must be a string");
          }
        }
        if (scene.overlay.title != null && !scene.overlay.title.trim()) {
          add(issues, `${path}.overlay.title`, "must be a non-empty string");
        }
        if (scene.overlay.background != null && !isObject(scene.overlay.background)) {
          add(issues, `${path}.overlay.background`, "must be an object");
        }
        if (isObject(scene.overlay.background)) {
          for (const key of Object.keys(scene.overlay.background)) {
            if (!OVERLAY_BACKGROUND_KEYS.has(key)) {
              add(issues, `${path}.overlay.background.${key}`, "is not an allowed overlay background property");
            }
          }
          if (scene.overlay.background.type !== "overviewTour") {
            add(issues, `${path}.overlay.background.type`, 'must equal "overviewTour"');
          }
          if (
            scene.overlay.background.dim != null
            && (!Number.isFinite(scene.overlay.background.dim)
              || scene.overlay.background.dim < 0
              || scene.overlay.background.dim > 0.8)
          ) {
            add(issues, `${path}.overlay.background.dim`, "must be between 0 and 0.8");
          }
          if (
            scene.overlay.background.interactive != null
            && typeof scene.overlay.background.interactive !== "boolean"
          ) {
            add(issues, `${path}.overlay.background.interactive`, "must be a boolean");
          }
        }
        if (scene.overlay.tour != null && !isObject(scene.overlay.tour)) {
          add(issues, `${path}.overlay.tour`, "must be an object");
        }
        if (isObject(scene.overlay.tour)) {
          for (const key of Object.keys(scene.overlay.tour)) {
            if (!OVERLAY_TOUR_KEYS.has(key)) {
              add(issues, `${path}.overlay.tour.${key}`, "is not an allowed overlay tour property");
            }
          }
          if (
            scene.overlay.tour.cycles != null
            && (!Number.isInteger(scene.overlay.tour.cycles)
              || scene.overlay.tour.cycles < 1
              || scene.overlay.tour.cycles > 5)
          ) {
            add(issues, `${path}.overlay.tour.cycles`, "must be an integer between 1 and 5");
          }
          for (const key of ["moveMs", "pauseMs"]) {
            if (
              scene.overlay.tour[key] != null
              && (!Number.isFinite(scene.overlay.tour[key])
                || scene.overlay.tour[key] < (key === "moveMs" ? 100 : 0)
                || scene.overlay.tour[key] > 10000)
            ) {
              add(
                issues,
                `${path}.overlay.tour.${key}`,
                `must be between ${key === "moveMs" ? 100 : 0} and 10000`,
              );
            }
          }
          if (
            scene.overlay.tour.endBehavior != null
            && !["hold", "loop"].includes(scene.overlay.tour.endBehavior)
          ) {
            add(issues, `${path}.overlay.tour.endBehavior`, 'must be "hold" or "loop"');
          }
        }
        if (scene.overlay.tour != null && scene.overlay.background?.type !== "overviewTour") {
          add(issues, `${path}.overlay.tour`, "requires background.type to equal \"overviewTour\"");
        }
      }

      if (scene.beats != null && !Array.isArray(scene.beats)) add(issues, `${path}.beats`, "must be an array");
      if (Array.isArray(scene.beats)) {
        const beatIds = new Set();
        scene.beats.forEach((beat, beatIndex) => {
          const beatPath = `${path}.beats[${beatIndex}]`;
          if (!isObject(beat)) {
            add(issues, beatPath, "must be an object");
            return;
          }
          for (const key of Object.keys(beat)) {
            if (!BEAT_KEYS.has(key)) add(issues, `${beatPath}.${key}`, "is not an allowed beat property");
          }
          if (checkId(issues, beat.id, `${beatPath}.id`)) {
            if (beatIds.has(beat.id)) add(issues, `${beatPath}.id`, `duplicates beat "${beat.id}"`);
            beatIds.add(beat.id);
          }
          for (const key of ["label", "caption"]) {
            if (beat[key] != null && typeof beat[key] !== "string") add(issues, `${beatPath}.${key}`, "must be a string");
          }
          checkIdList(issues, beat.show, `${beatPath}.show`, local);
          if (beat.focus != null) checkIdList(issues, beat.focus, `${beatPath}.focus`, local);
          if (beat.revealOrder != null) checkIdList(issues, beat.revealOrder, `${beatPath}.revealOrder`, local);
        });
      }
    });
  }

  const allEdges = [];
  if (Array.isArray(deck.scenes)) {
    deck.scenes.forEach((scene, sceneIndex) => {
      if (scene.edges != null && !Array.isArray(scene.edges)) add(issues, `scenes[${sceneIndex}].edges`, "must be an array");
      if (Array.isArray(scene.edges)) {
        scene.edges.forEach((edge, edgeIndex) => allEdges.push({ edge, path: `scenes[${sceneIndex}].edges[${edgeIndex}]` }));
      }
    });
  }
  if (deck.connections != null && !Array.isArray(deck.connections)) add(issues, "connections", "must be an array");
  if (Array.isArray(deck.connections)) {
    deck.connections.forEach((edge, edgeIndex) => allEdges.push({ edge, path: `connections[${edgeIndex}]` }));
  }
  const edgeIds = new Set();
  allEdges.forEach(({ edge, path }) => {
    if (!isObject(edge)) {
      add(issues, path, "must be an object");
      return;
    }
    for (const key of Object.keys(edge)) {
      if (!EDGE_KEYS.has(key)) add(issues, `${path}.${key}`, "is not an allowed edge property");
    }
    if (edge.id != null && checkId(issues, edge.id, `${path}.id`)) {
      if (edgeIds.has(edge.id)) add(issues, `${path}.id`, `duplicates edge "${edge.id}"`);
      edgeIds.add(edge.id);
    }
    if (!instanceIds.has(edge.from)) add(issues, `${path}.from`, `unknown instance "${edge.from}"`);
    if (!instanceIds.has(edge.to)) add(issues, `${path}.to`, `unknown instance "${edge.to}"`);
    if (edge.label != null && typeof edge.label !== "string") add(issues, `${path}.label`, "must be a string");
    if (edge.kind != null && (typeof edge.kind !== "string" || !KIND_RE.test(edge.kind))) add(issues, `${path}.kind`, "must be style tokens");
    if (edge.curve != null && !Number.isFinite(edge.curve)) add(issues, `${path}.curve`, "must be finite");
  });

  if (nodeCount > maxNodes) add(issues, "scenes", `contains ${nodeCount} instances; maximum is ${maxNodes}`);
  if (allEdges.length > maxEdges) add(issues, "connections", `deck contains ${allEdges.length} edges; maximum is ${maxEdges}`);

  if (deck.theme != null && !isObject(deck.theme)) add(issues, "theme", "must be an object");
  if (isObject(deck.theme?.colors)) {
    for (const [key, value] of Object.entries(deck.theme.colors)) {
      if (typeof value !== "string" || !HEX_COLOR_RE.test(value)) add(issues, `theme.colors.${key}`, "must be a six-digit hex color");
    }
  }

  return { valid: issues.length === 0, issues };
}

function assertValidDeck(deck, options) {
  const result = validateDeck(deck, options);
  if (!result.valid) throw new DeckValidationError(result.issues);
  return deck;
}

function formatIssues(issues) {
  return issues.map((issue) => `${issue.path}: ${issue.message}`).join("\n");
}


function nodeHalfSize(instance, measured) {
  if ((instance.kind ?? "").split(" ").includes("ring")) {
    const radius = instance.r ?? 90;
    return { x: radius, y: radius };
  }
  return {
    x: (measured?.width ?? instance.w ?? 180) / 2,
    y: (measured?.height ?? 80) / 2
  };
}

function boundsFor(instanceIds, instanceMap, measurements = new Map()) {
  if (!instanceIds.length) return { x0: 0, y0: 0, x1: 1, y1: 1, width: 1, height: 1 };
  let x0 = Infinity;
  let y0 = Infinity;
  let x1 = -Infinity;
  let y1 = -Infinity;
  for (const id of instanceIds) {
    const instance = instanceMap.get(id);
    if (!instance) continue;
    const half = nodeHalfSize(instance, measurements.get(id));
    const x = instance.sceneAnchor[0] + instance.pos[0];
    const y = instance.sceneAnchor[1] + instance.pos[1];
    x0 = Math.min(x0, x - half.x);
    y0 = Math.min(y0, y - half.y);
    x1 = Math.max(x1, x + half.x);
    y1 = Math.max(y1, y + half.y);
  }
  if (!Number.isFinite(x0)) return { x0: 0, y0: 0, x1: 1, y1: 1, width: 1, height: 1 };
  return { x0, y0, x1, y1, width: Math.max(1, x1 - x0), height: Math.max(1, y1 - y0) };
}

function fitBounds(bounds, viewport, layout, options = {}) {
  const mobile = viewport.width < 700;
  const pad = mobile ? Math.min(layout.fitMargin, 54) : layout.fitMargin;
  const cardSpace = options.cardSpace ?? 0;
  const safe = {
    top: options.safeArea?.top ?? 0,
    right: options.safeArea?.right ?? 0,
    bottom: options.safeArea?.bottom ?? 0,
    left: options.safeArea?.left ?? 0,
  };
  const availableWidth = Math.max(1, viewport.width - safe.left - safe.right);
  const availableHeight = Math.max(1, viewport.height - safe.top - safe.bottom);
  const ideal = Math.min(
    availableWidth / (bounds.width + pad * 2),
    availableHeight / (bounds.height + pad * 2 + cardSpace),
    layout.zoomMax
  );
  const floor = mobile
    ? Math.min(layout.minReadableScale, options.mobileEmergencyFloor ?? 0.18)
    : layout.minReadableScale;
  const scale = Math.max(floor, ideal);
  const safeCenterX = safe.left + availableWidth / 2;
  const safeCenterY = safe.top + availableHeight / 2;
  return {
    x: (bounds.x0 + bounds.x1) / 2 - (safeCenterX - viewport.width / 2) / scale,
    y: (bounds.y0 + bounds.y1) / 2
      - (safeCenterY - viewport.height / 2) / scale
      - (cardSpace ? cardSpace / (2 * scale) : 0),
    scale,
    idealScale: ideal,
    overflow: ideal < floor,
    availableWidth,
    availableHeight,
    pad
  };
}

function fitWindow(bounds, viewport, layout, options = {}) {
  const fit = fitBounds(bounds, viewport, layout, options);
  if (options.aspectRatio) {
    let halfWidth = (bounds.width + fit.pad * 2) / 2;
    let halfHeight = (bounds.height + fit.pad * 2 + (options.cardSpace ?? 0)) / 2;
    if (halfWidth / halfHeight < options.aspectRatio) {
      halfWidth = halfHeight * options.aspectRatio;
    } else {
      halfHeight = halfWidth / options.aspectRatio;
    }
    return {
      x: fit.x,
      y: fit.y,
      halfWidth,
      halfHeight,
      margin: layout.pushMargin,
      scale: fit.scale,
    };
  }
  return {
    x: fit.x,
    y: fit.y,
    halfWidth: fit.availableWidth / (2 * fit.scale),
    halfHeight: fit.availableHeight / (2 * fit.scale),
    margin: layout.pushMargin,
    scale: fit.scale,
  };
}

function interpolateWindow(from, to, amount) {
  const t = Math.max(0, Math.min(1, amount));
  return {
    x: from.x + (to.x - from.x) * t,
    y: from.y + (to.y - from.y) * t,
    halfWidth: from.halfWidth + (to.halfWidth - from.halfWidth) * t,
    halfHeight: from.halfHeight + (to.halfHeight - from.halfHeight) * t,
    margin: to.margin,
    scale: from.scale + (to.scale - from.scale) * t,
  };
}

function borderPoint(node, targetX, targetY) {
  const dx = targetX - node.x;
  const dy = targetY - node.y;
  if (!dx && !dy) return [node.x, node.y];
  if (node.isRing) {
    const distance = Math.hypot(dx, dy) || 1;
    return [node.x + (dx / distance) * node.radius, node.y + (dy / distance) * node.radius];
  }
  const halfWidth = node.width / 2 + 6;
  const halfHeight = node.height / 2 + 6;
  const scale = Math.min(dx ? halfWidth / Math.abs(dx) : Infinity, dy ? halfHeight / Math.abs(dy) : Infinity, 1);
  return [node.x + dx * scale, node.y + dy * scale];
}


const GRAPH_DECK_MOTION = Object.freeze({
  cameraFrameFactor: 0.065,
  contextOpacity: 0.55,
  edgeFadeMs: 700,
  edgeFrameStride: 2,
  initialCamera: Object.freeze({ x: 2000, y: 1200, scale: 0.3 }),
  nodeFadeMs: 700,
  pushFrameFactor: 0.06,
  referenceFps: 60,
  revealStartMs: 80,
  revealStaggerMs: 140,
  tourMoveMs: 700,
  tourPauseMs: 500,
  tourStartDelayMs: 500,
});

/**
 * Preserve a per-frame easing coefficient while making it independent of
 * monitor refresh rate and transient frame duration.
 */
function frameEase(frameFactor, deltaSeconds, referenceFps = GRAPH_DECK_MOTION.referenceFps) {
  const frames = Math.min(0.05, Math.max(0, deltaSeconds)) * referenceFps;
  return 1 - Math.pow(1 - frameFactor, frames);
}



function clone(value) {
  return typeof structuredClone === "function"
    ? structuredClone(value)
    : JSON.parse(JSON.stringify(value));
}

function compileDeck(input, options) {
  assertValidDeck(input, options);
  const deck = clone(input);
  const entityMap = new Map(Object.entries(deck.entities));
  const instanceMap = new Map();
  const entityIndex = new Map();

  const scenes = deck.scenes.map((scene, sceneIndex) => {
    const instanceIds = new Set(scene.instances.map((instance) => instance.id));
    const instances = scene.instances.map((instance, instanceIndex) => {
      const compiled = {
        ...instance,
        sceneId: scene.id,
        sceneIndex,
        instanceIndex,
        entityDef: entityMap.get(instance.entity)
      };
      instanceMap.set(compiled.id, compiled);
      const locations = entityIndex.get(compiled.entity) ?? [];
      locations.push(compiled.id);
      entityIndex.set(compiled.entity, locations);
      return compiled;
    });

    const allIds = instances.map((instance) => instance.id);
    const beats = scene.beats?.length
      ? scene.beats.map((beat) => {
          const show = [...beat.show];
          const focus = beat.focus?.length ? [...beat.focus] : [...show];
          return {
            ...beat,
            show,
            focus,
            revealOrder: beat.revealOrder?.length ? [...beat.revealOrder] : [...show]
          };
        })
      : [{ id: "all", show: allIds, focus: allIds, revealOrder: allIds }];

    return {
      ...scene,
      instances,
      instanceIds,
      beats,
      overlay: scene.overlay
        ? {
            position: "center",
            shape: "slide",
            aspectRatio: "16:9",
            title: scene.title,
            caption: scene.caption ?? "",
            ...scene.overlay,
            background: scene.overlay.background
              ? {
                  dim: 0.22,
                  interactive: false,
                  ...scene.overlay.background,
                }
              : null,
            tour: scene.overlay.background?.type === "overviewTour"
              ? {
                  cycles: 1,
                  moveMs: 700,
                  pauseMs: 500,
                  endBehavior: "hold",
                  ...(scene.overlay.tour ?? {}),
                }
              : null,
          }
        : null,
      layout: {
        fitMargin: 150,
        pushMargin: 160,
        zoomMax: 1.15,
        floatAmp: 3.5,
        minReadableScale: 0.58,
        ...(deck.layoutDefaults ?? {}),
        ...(scene.layout ?? {})
      }
    };
  });

  const edges = [
    ...scenes.flatMap((scene) => (scene.edges ?? []).map((edge) => ({ ...edge, sceneId: scene.id }))),
    ...(deck.connections ?? []).map((edge) => ({ ...edge, sceneId: null }))
  ];

  return {
    deck,
    meta: deck.meta,
    theme: deck.theme ?? {},
    entities: entityMap,
    scenes,
    instanceMap,
    entityIndex,
    edges
  };
}

function serializeDeck(compiledOrDeck) {
  const deck = compiledOrDeck.deck ?? compiledOrDeck;
  return `${JSON.stringify(deck, null, 2)}\n`;
}


function svgElement(name, attrs = {}) {
  const element = document.createElementNS("http://www.w3.org/2000/svg", name);
  for (const [key, value] of Object.entries(attrs)) element.setAttribute(key, String(value));
  return element;
}

function createVisual(type) {
  if (type === "network7") {
    const wrapper = document.createElement("div");
    wrapper.className = "pz-mini-network";
    const svg = svgElement("svg", { viewBox: "0 0 200 96", "aria-hidden": "true" });
    const points = [
      [18, 57, "a"], [55, 57, "b"], [91, 28, "c"], [91, 74, "d"],
      [130, 16, "e"], [140, 49, "f"], [151, 76, "g"]
    ];
    const links = [[0, 1], [1, 2], [1, 3], [2, 4], [2, 5], [3, 6], [4, 6]];
    links.forEach(([a, b]) => svg.appendChild(svgElement("line", {
      x1: points[a][0], y1: points[a][1], x2: points[b][0], y2: points[b][1]
    })));
    points.forEach(([x, y, label]) => {
      svg.appendChild(svgElement("circle", { cx: x, cy: y, r: 5 }));
      const text = svgElement("text", { x: x - 2, y: y + 17 });
      text.textContent = label;
      svg.appendChild(text);
    });
    wrapper.appendChild(svg);
    return wrapper;
  }

  if (type === "table7") {
    const wrapper = document.createElement("div");
    wrapper.className = "pz-mini-table";
    const nodes = document.createElement("section");
    const edges = document.createElement("section");
    const nodesHeading = document.createElement("b");
    const edgesHeading = document.createElement("b");
    nodesHeading.textContent = "nodes";
    edgesHeading.textContent = "edges";
    nodes.append(nodesHeading, document.createTextNode("● a\n● b\n● c\n● d\n● e\n● f\n● g"));
    edges.append(edgesHeading, document.createTextNode("a → b\nb → c\nb → d\nc → e\nc → f\nd → g\ne → g"));
    wrapper.append(nodes, edges);
    return wrapper;
  }

  if (type === "jsonSnippet") {
    const wrapper = document.createElement("pre");
    wrapper.className = "pz-json-visual";
    wrapper.textContent = `{\n  "entity": "graph",\n  "pos": [320, 180]\n}`;
    return wrapper;
  }

  return null;
}






const SVG_NS = "http://www.w3.org/2000/svg";

function element(name, className, text) {
  const node = document.createElement(name);
  if (className) node.className = className;
  if (text != null) node.textContent = text;
  return node;
}

function svgElement(name, className) {
  const node = document.createElementNS(SVG_NS, name);
  if (className) node.setAttribute("class", className);
  return node;
}

function easeInOutCubic(value) {
  return value < 0.5
    ? 4 * value * value * value
    : 1 - Math.pow(-2 * value + 2, 3) / 2;
}
